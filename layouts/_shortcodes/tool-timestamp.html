{{ partial "tools/style.html" . }}
<div class="tk" id="ts">
  <div class="tk-card">
    <div class="tk-h">当前时间</div>
    <div class="tk-row">
      <div class="ts-now">
        <span class="tk-label">秒级</span>
        <code class="tk-out big" id="ts-sec" title="点击复制">-</code>
      </div>
      <div class="ts-now">
        <span class="tk-label">毫秒级</span>
        <code class="tk-out big" id="ts-ms" title="点击复制">-</code>
      </div>
    </div>
    <p class="tk-hint" id="ts-local">-</p>
    <div class="tk-row">
      <button type="button" class="tk-btn ghost sm" id="ts-pause">暂停刷新</button>
    </div>
  </div>

  <div class="tk-card">
    <div class="tk-h">时间戳 → 日期时间</div>
    <div class="tk-field">
      <div class="tk-row">
        <input class="tk-input tk-input-mono" id="ts-in" inputmode="numeric"
               placeholder="粘贴时间戳，秒 / 毫秒 / 微秒自动识别">
      </div>
      <p class="tk-hint" id="ts-in-unit"></p>
    </div>
    <dl class="tk-kv" id="ts-out"></dl>
  </div>

  <div class="tk-card">
    <div class="tk-h">日期时间 → 时间戳</div>
    <div class="tk-field">
      <label class="tk-label" for="ts-date">选择日期时间（按本机时区解释）</label>
      <input class="tk-input" type="datetime-local" id="ts-date" step="1">
    </div>
    <dl class="tk-kv" id="ts-date-out"></dl>
  </div>

  <div class="tk-card">
    <div class="tk-h">世界时钟</div>
    <dl class="tk-kv" id="ts-zones"></dl>
  </div>
</div>
<div class="tk-toast" id="ts-toast"></div>

<style>
.ts-now { flex: 1 1 10rem; min-width: 0; }
.ts-now .tk-out { cursor: pointer; -webkit-user-select: none; user-select: none; }
</style>

<script>
(function () {
  "use strict";

  var ZONES = [
    ["北京 / 上海", "Asia/Shanghai"],
    ["UTC", "UTC"],
    ["东京", "Asia/Tokyo"],
    ["新加坡", "Asia/Singapore"],
    ["伦敦", "Europe/London"],
    ["纽约", "America/New_York"],
    ["洛杉矶", "America/Los_Angeles"],
    ["悉尼", "Australia/Sydney"]
  ];

  var $ = function (id) { return document.getElementById(id); };
  var toast = $("ts-toast");
  var toastTimer;
  var paused = false;

  function say(msg) {
    toast.textContent = msg;
    toast.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove("on"); }, 1600);
  }

  function copy(text, msg) {
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.cssText = "position:absolute;left:-9999px;top:0";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      try { document.execCommand("copy"); say(msg); } catch (e) { say("复制失败"); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { say(msg); }, fallback);
    } else { fallback(); }
  }

  function pad(n, w) {
    var s = String(Math.abs(n));
    while (s.length < (w || 2)) { s = "0" + s; }
    return (n < 0 ? "-" : "") + s;
  }

  /* 用 Intl 拿到指定时区的各字段 */
  function partsIn(d, tz) {
    var f = new Intl.DateTimeFormat("en-CA", {
      timeZone: tz, hour12: false,
      year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", second: "2-digit", weekday: "short"
    });
    var o = {};
    f.formatToParts(d).forEach(function (p) { o[p.type] = p.value; });
    if (o.hour === "24") { o.hour = "00"; }
    return o;
  }

  function fmt(d, tz, withWeekday) {
    var p = partsIn(d, tz);
    return p.year + "-" + p.month + "-" + p.day + " " + p.hour + ":" + p.minute + ":" + p.second +
      (withWeekday ? " " + p.weekday : "");
  }

  function tzOffsetLabel(d) {
    var off = -d.getTimezoneOffset();
    var sign = off < 0 ? "-" : "+";
    var a = Math.abs(off);
    return "UTC" + sign + pad(Math.floor(a / 60)) + ":" + pad(a % 60);
  }

  function relative(ms) {
    var diff = Date.now() - ms;
    var future = diff < 0;
    var s = Math.round(Math.abs(diff) / 1000);
    var units = [[31536000, "年"], [2592000, "个月"], [86400, "天"], [3600, "小时"], [60, "分钟"], [1, "秒"]];
    for (var i = 0; i < units.length; i++) {
      if (s >= units[i][0]) {
        var n = Math.floor(s / units[i][0]);
        return future ? (n + units[i][1] + "后") : (n + units[i][1] + "前");
      }
    }
    return "刚刚";
  }

  /* ---------- 当前时间 ---------- */
  function tick() {
    if (!paused) {
      var now = Date.now();
      $("ts-sec").textContent = String(Math.floor(now / 1000));
      $("ts-ms").textContent = String(now);
      var d = new Date(now);
      $("ts-local").textContent = "本机时间 " + fmt(d, undefined, true) + "（" +
        (Intl.DateTimeFormat().resolvedOptions().timeZone || "本地") + " " + tzOffsetLabel(d) + "）";
      renderZones(d);
    }
    requestAnimationFrame(function () { setTimeout(tick, 400); });
  }

  $("ts-pause").addEventListener("click", function () {
    paused = !paused;
    this.textContent = paused ? "继续刷新" : "暂停刷新";
  });
  $("ts-sec").addEventListener("click", function () { copy(this.textContent, "已复制秒级时间戳"); });
  $("ts-ms").addEventListener("click", function () { copy(this.textContent, "已复制毫秒级时间戳"); });

  /* ---------- 世界时钟 ---------- */
  function renderZones(d) {
    var box = $("ts-zones");
    var html = ZONES.map(function (z) {
      var val;
      try { val = fmt(d, z[1], true); } catch (e) { val = "不支持该时区"; }
      return "<dt>" + z[0] + "</dt><dd>" + val + "</dd>";
    }).join("");
    if (box.innerHTML !== html) { box.innerHTML = html; }
  }

  /* ---------- 时间戳 → 日期 ---------- */
  function parseStamp(raw) {
    var s = raw.replace(/[\s,_]/g, "");
    if (!/^-?\d+(\.\d+)?$/.test(s)) { return null; }
    var digits = s.replace(/^-/, "").split(".")[0].length;
    var n = parseFloat(s);
    if (digits <= 11) { return { ms: n * 1000, unit: "秒（10 位）" }; }
    if (digits <= 14) { return { ms: n, unit: "毫秒（13 位）" }; }
    if (digits <= 17) { return { ms: n / 1000, unit: "微秒（16 位）" }; }
    return { ms: n / 1000000, unit: "纳秒（19 位）" };
  }

  function renderStamp() {
    var raw = $("ts-in").value.trim();
    var out = $("ts-out");
    var unitBox = $("ts-in-unit");
    if (!raw) {
      out.innerHTML = '<dt>结果</dt><dd class="tk-out empty" style="padding:.4rem .6rem">在上面粘贴一个时间戳</dd>';
      unitBox.textContent = "";
      return;
    }
    var p = parseStamp(raw);
    if (!p || !isFinite(p.ms)) {
      out.innerHTML = '<dt>结果</dt><dd>无法识别，请输入纯数字时间戳</dd>';
      unitBox.textContent = "";
      return;
    }
    var d = new Date(p.ms);
    if (isNaN(d.getTime())) {
      out.innerHTML = '<dt>结果</dt><dd>超出可表示的时间范围</dd>';
      unitBox.textContent = "";
      return;
    }
    unitBox.textContent = "按 " + p.unit + " 解析";
    out.innerHTML =
      "<dt>本机时区</dt><dd>" + fmt(d, undefined, true) + "</dd>" +
      "<dt>北京时间</dt><dd>" + fmt(d, "Asia/Shanghai", true) + "</dd>" +
      "<dt>UTC</dt><dd>" + fmt(d, "UTC", true) + "</dd>" +
      "<dt>ISO 8601</dt><dd>" + d.toISOString() + "</dd>" +
      "<dt>相对现在</dt><dd>" + relative(p.ms) + "</dd>" +
      "<dt>秒 / 毫秒</dt><dd>" + Math.floor(p.ms / 1000) + " / " + Math.round(p.ms) + "</dd>";
  }
  $("ts-in").addEventListener("input", renderStamp);

  /* ---------- 日期 → 时间戳 ---------- */
  function renderDate() {
    var v = $("ts-date").value;
    var out = $("ts-date-out");
    if (!v) {
      out.innerHTML = '<dt>结果</dt><dd class="tk-out empty" style="padding:.4rem .6rem">选择一个日期时间</dd>';
      return;
    }
    var d = new Date(v);
    if (isNaN(d.getTime())) {
      out.innerHTML = "<dt>结果</dt><dd>日期无效</dd>";
      return;
    }
    var ms = d.getTime();
    out.innerHTML =
      "<dt>秒级</dt><dd>" + Math.floor(ms / 1000) + "</dd>" +
      "<dt>毫秒级</dt><dd>" + ms + "</dd>" +
      "<dt>UTC</dt><dd>" + fmt(d, "UTC", true) + "</dd>" +
      "<dt>ISO 8601</dt><dd>" + d.toISOString() + "</dd>";
  }
  $("ts-date").addEventListener("input", renderDate);

  /* 初始化 */
  (function initDate() {
    var d = new Date();
    $("ts-date").value = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) +
      "T" + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
  })();
  renderStamp();
  renderDate();
  tick();
})();
</script>
