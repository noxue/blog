{{ partial "tools/style.html" . }}
{{- $qrLib := resources.Get "lib/qrcode/qrcode.js" | minify | fingerprint -}}
<script src="{{ $qrLib.RelPermalink }}" integrity="{{ $qrLib.Data.Integrity }}"></script>

<div class="tk" id="qr">
  <div class="tk-card">
    <div class="tk-field">
      <span class="tk-label">内容类型</span>
      <div class="tk-seg" id="qr-kinds">
        <button type="button" data-kind="text" class="on">文本 / 网址</button>
        <button type="button" data-kind="wifi">Wi-Fi</button>
      </div>
    </div>

    <div id="qr-pane-text">
      <div class="tk-field">
        <label class="tk-label" for="qr-text">内容</label>
        <textarea class="tk-textarea" id="qr-text" spellcheck="false"
                  placeholder="输入网址或任意文本，例如 https://noxue.com">https://noxue.com</textarea>
      </div>
    </div>

    <div id="qr-pane-wifi" hidden>
      <div class="tk-grid2">
        <div class="tk-field">
          <label class="tk-label" for="qr-ssid">Wi-Fi 名称（SSID）</label>
          <input class="tk-input" id="qr-ssid" placeholder="MyWiFi" autocomplete="off">
        </div>
        <div class="tk-field">
          <label class="tk-label" for="qr-pass">密码</label>
          <input class="tk-input" id="qr-pass" placeholder="留空表示开放网络" autocomplete="off">
        </div>
      </div>
      <div class="tk-field">
        <span class="tk-label">加密方式</span>
        <div class="tk-seg" id="qr-auths">
          <button type="button" data-auth="WPA" class="on">WPA / WPA2</button>
          <button type="button" data-auth="WEP">WEP</button>
          <button type="button" data-auth="nopass">无密码</button>
        </div>
        <p class="tk-hint">手机相机扫这个码就能直接连上 Wi-Fi，适合贴在路由器上或分享给客人。</p>
      </div>
    </div>

    <div class="tk-grid2">
      <div class="tk-field">
        <label class="tk-label" for="qr-size">图片尺寸：<span id="qr-size-val">320</span> px</label>
        <input class="tk-range" type="range" id="qr-size" min="120" max="1024" step="8" value="320">
      </div>
      <div class="tk-field">
        <span class="tk-label">容错级别</span>
        <div class="tk-seg" id="qr-ecs">
          <button type="button" data-ec="L">L 7%</button>
          <button type="button" data-ec="M" class="on">M 15%</button>
          <button type="button" data-ec="Q">Q 25%</button>
          <button type="button" data-ec="H">H 30%</button>
        </div>
      </div>
    </div>
  </div>

  <div class="tk-card">
    <div class="tk-h">二维码</div>
    <div class="qr-preview" id="qr-preview">
      <img id="qr-img" alt="生成的二维码">
    </div>
    <p class="tk-hint" id="qr-meta"></p>
    <div class="tk-row" style="margin-top:.6rem">
      <button type="button" class="tk-btn sm" id="qr-png">下载 PNG</button>
      <button type="button" class="tk-btn ghost sm" id="qr-svg">下载 SVG</button>
    </div>
    <p class="tk-hint">手机上长按二维码图片也可以直接保存到相册。</p>
  </div>
</div>
<div class="tk-toast" id="qr-toast"></div>

<style>
.qr-preview {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: .8rem;
  border-radius: 10px;
  background: #fff;
  border: 1px solid var(--borderColor-default, #eee);
  min-height: 8rem;
}
.qr-preview img { max-width: 100%; height: auto; image-rendering: pixelated; }
.qr-preview.err { color: #c45656; font-size: .85rem; background: var(--bgColor-secondary, #f6f6f6); }
</style>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var kind = "text";
  var ec = "M";
  var auth = "WPA";
  var toast = $("qr-toast");
  var toastTimer;
  var lastQR = null;

  function say(msg) {
    toast.textContent = msg;
    toast.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove("on"); }, 1600);
  }

  /* Wi-Fi 字段里的 \ ; , : " 需要转义 */
  function esc(s) { return String(s).replace(/([\\;,:"])/g, "\\$1"); }

  function payload() {
    if (kind === "wifi") {
      var ssid = $("qr-ssid").value;
      if (!ssid) { return ""; }
      var pass = $("qr-pass").value;
      var t = auth === "nopass" ? "nopass" : auth;
      return "WIFI:T:" + t + ";S:" + esc(ssid) + ";" +
        (t === "nopass" ? "" : "P:" + esc(pass) + ";") + ";";
    }
    return $("qr-text").value;
  }

  function render() {
    var size = parseInt($("qr-size").value, 10);
    $("qr-size-val").textContent = size;

    var data = payload();
    var box = $("qr-preview");
    var img = $("qr-img");

    if (!data) {
      box.classList.remove("err");
      img.removeAttribute("src");
      $("qr-meta").textContent = kind === "wifi" ? "请填写 Wi-Fi 名称" : "请输入要生成的内容";
      lastQR = null;
      return;
    }

    var qr;
    try {
      qrcode.stringToBytes = qrcode.stringToBytesFuncs["UTF-8"];
      qr = qrcode(0, ec);
      qr.addData(data, "Byte");
      qr.make();
    } catch (e) {
      box.classList.add("err");
      img.removeAttribute("src");
      $("qr-meta").textContent = "";
      box.setAttribute("data-err", "1");
      lastQR = null;
      say("内容太长了，试试降低容错级别或减少内容");
      return;
    }
    box.classList.remove("err");

    var count = qr.getModuleCount();
    var quiet = 4;
    var total = count + quiet * 2;
    var cell = Math.max(1, Math.floor(size / total));
    var px = cell * total;

    var cv = document.createElement("canvas");
    cv.width = px;
    cv.height = px;
    var ctx = cv.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, px, px);
    ctx.fillStyle = "#000000";
    for (var r = 0; r < count; r++) {
      for (var c = 0; c < count; c++) {
        if (qr.isDark(r, c)) {
          ctx.fillRect((c + quiet) * cell, (r + quiet) * cell, cell, cell);
        }
      }
    }

    img.src = cv.toDataURL("image/png");
    img.style.width = px + "px";
    lastQR = { qr: qr, count: count, cell: cell, quiet: quiet, canvas: cv };
    $("qr-meta").textContent = "版本 " + ((count - 17) / 4) + "，" + count + "×" + count +
      " 模块，实际 " + px + "×" + px + " px，容错 " + ec + "，内容 " +
      new TextEncoder().encode(data).length + " 字节";
  }

  function download(href, name) {
    var a = document.createElement("a");
    a.href = href;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  $("qr-png").addEventListener("click", function () {
    if (!lastQR) { return say("先输入内容"); }
    download(lastQR.canvas.toDataURL("image/png"), "qrcode.png");
  });

  $("qr-svg").addEventListener("click", function () {
    if (!lastQR) { return say("先输入内容"); }
    var n = lastQR.count, q = lastQR.quiet, t = n + q * 2;
    var path = [];
    for (var r = 0; r < n; r++) {
      for (var c = 0; c < n; c++) {
        if (lastQR.qr.isDark(r, c)) { path.push("M" + (c + q) + " " + (r + q) + "h1v1h-1z"); }
      }
    }
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + t + " " + t +
      '" shape-rendering="crispEdges"><rect width="' + t + '" height="' + t +
      '" fill="#fff"/><path d="' + path.join("") + '" fill="#000"/></svg>';
    download("data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg), "qrcode.svg");
  });

  function segPick(box, attr, cb) {
    $(box).addEventListener("click", function (e) {
      var b = e.target.closest ? e.target.closest("button") : null;
      if (!b || !b.hasAttribute(attr)) { return; }
      Array.prototype.forEach.call(this.querySelectorAll("button"), function (x) { x.classList.remove("on"); });
      b.classList.add("on");
      cb(b.getAttribute(attr));
    });
  }

  segPick("qr-kinds", "data-kind", function (v) {
    kind = v;
    $("qr-pane-text").hidden = v !== "text";
    $("qr-pane-wifi").hidden = v !== "wifi";
    render();
  });
  segPick("qr-ecs", "data-ec", function (v) { ec = v; render(); });
  segPick("qr-auths", "data-auth", function (v) {
    auth = v;
    $("qr-pass").disabled = v === "nopass";
    render();
  });

  ["qr-text", "qr-ssid", "qr-pass"].forEach(function (id) {
    $(id).addEventListener("input", render);
  });
  $("qr-size").addEventListener("input", render);

  render();
})();
</script>
