    var p = raw.split("|");
    var cc = p[0];
    return { cc: cc, sf: p[1], zh: SHORT[cc] || p[2], full: p[2], en: p[3] };
  });
  var byCC = {};
  list.forEach(function (c) { byCC[c.cc] = c; });

  function flag(cc) {
    return String.fromCodePoint.apply(String, cc.split("").map(function (ch) {
      return 127397 + ch.charCodeAt(0);
    }));
  }

  function urlFor(c) {
    var u = "itms-apps://itunes.apple.com/WebObjects/MZStore.woa/wa/resetAndRedirect?cc=" + c.cc.toLowerCase();
    return c.sf ? u + "&dsf=" + c.sf : u;
  }

  /* ---------- Safari 检测 ---------- */
  var ua = navigator.userAgent;
  var isIOS = /iPad|iPhone|iPod/.test(ua) ||
    (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var isMac = /Macintosh/.test(ua) && !isIOS;
  var inAppWebview = /MicroMessenger|QQ\/|QQBrowser|AlipayClient|DingTalk|Weibo|baidu|BaiduBoxApp|UCBrowser|Quark|Line\/|FBAN|FBAV|FBIOS|Instagram|Snapchat|TikTok|BytedanceWebview|Twitter|Electron|; wv\)/i.test(ua);
  var otherBrowser = /CriOS|FxiOS|EdgiOS|OPiOS|OPT\/|OPR\/|Chrome\/|Chromium\/|Firefox\/|Edg\//.test(ua);
  var looksSafari = /Safari\//.test(ua) && /Version\/\d/.test(ua) && !inAppWebview && !otherBrowser;
  /* WKWebView 的默认 UA 与 Safari 一致，靠 navigator.standalone 区分：只有 Mobile Safari 有这个属性 */
  var isSafari = isIOS
    ? (looksSafari && typeof navigator.standalone !== "undefined")
    : looksSafari;
  var canJump = (isIOS || isMac) && isSafari;

  /* ---------- 顶部提示条 ---------- */
  if (!canJump) {
    var title = $("asr-banner-title");
    var desc = $("asr-banner-desc");
    if (!isIOS && !isMac) {
      title.textContent = "请用 iPhone、iPad 或 Mac 打开本页面";
      desc.textContent = "切换链接只能在 Apple 设备上唤起 App Store，当前设备用不了。";
    } else if (inAppWebview) {
      title.textContent = "请在 Safari 中打开本页面";
      desc.textContent = "微信、QQ 等 App 内置浏览器无法唤起 App Store。点右上角「···」→「在 Safari 中打开」，或复制链接后粘贴到 Safari。";
    } else {
      title.textContent = "请在 Safari 中打开本页面";
      desc.textContent = "当前浏览器无法唤起 App Store，请复制链接后在 Safari 中打开再点击。";
    }
    $("asr-banner").hidden = false;
  }

  /* ---------- 渲染 ---------- */
  function card(c) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "asr-item";
    b.setAttribute("data-cc", c.cc);
    b.title = c.full + " · " + c.en;
    b.innerHTML = '<span class="asr-flag" aria-hidden="true">' + flag(c.cc) + "</span>" +
      '<span class="asr-name"></span>' +
      '<span class="asr-cc">' + c.cc + "</span>";
    b.querySelector(".asr-name").textContent = c.zh;
    return b;
  }

  var hotBox = $("asr-hot");
  HOT.forEach(function (cc) {
    if (byCC[cc]) { hotBox.appendChild(card(byCC[cc])); }
  });

  var allBox = $("asr-all");
  var emptyBox = $("asr-empty");
  var countBox = $("asr-count");
  var frag = document.createDocumentFragment();
  list.forEach(function (c) { frag.appendChild(card(c)); });
  allBox.appendChild(frag);
  countBox.textContent = "共 " + list.length + " 个国家和地区";

  /* ---------- 搜索 ---------- */
  var q = $("asr-q");
  var clearBtn = $("asr-clear");

  function filter() {
    var kw = q.value.trim().toLowerCase();
    clearBtn.hidden = !kw;
    var shown = 0;
    var nodes = allBox.children;
    for (var i = 0; i < nodes.length; i++) {
      var c = byCC[nodes[i].getAttribute("data-cc")];
      var hit = !kw ||
        c.zh.indexOf(kw) > -1 ||
        c.full.indexOf(kw) > -1 ||
        c.en.toLowerCase().indexOf(kw) > -1 ||
        c.cc.toLowerCase().indexOf(kw) > -1;
      nodes[i].hidden = !hit;
      if (hit) { shown++; }
    }
    emptyBox.hidden = shown > 0;
    countBox.textContent = kw
      ? "匹配到 " + shown + " 个（共 " + list.length + " 个）"
      : "共 " + list.length + " 个国家和地区";
  }

  q.addEventListener("input", filter);
  q.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); q.blur(); }
  });
  clearBtn.addEventListener("click", function () {
    q.value = "";
    filter();
    q.focus();
  });

  /* ---------- 跳转 / 弹窗 ---------- */
  var modal = $("asr-modal");
  var pending = "";

  function openModal(url, label) {
    pending = url;
    $("asr-modal-url").value = location.href;
    $("asr-modal-desc").textContent = (!isIOS && !isMac)
      ? "「" + label + "」的切换链接需要在 iPhone、iPad 或 Mac 的 Safari 中点击才能唤起 App Store。"
      : "「" + label + "」的切换链接需要 Safari 才能唤起 App Store，按下面的步骤操作：";
    var steps = $("asr-steps");
    steps.innerHTML = "";
    var items = inAppWebview
      ? ["点击右上角「···」，选择「在 Safari 中打开」", "在 Safari 里回到本页面", "再次点击要切换的地区"]
      : ["复制下面的本页链接", "在 Safari 中粘贴打开", "再次点击要切换的地区"];
    items.forEach(function (t) {
      var li = document.createElement("li");
      li.textContent = t;
      steps.appendChild(li);
    });
    modal.hidden = false;
  }

  function closeModal() { modal.hidden = true; }

  function jump(url) {
    var a = document.createElement("a");
    a.href = url;
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  function handle(url, label) {
    if (canJump) { jump(url); } else { openModal(url, label); }
  }

  document.getElementById("asr").addEventListener("click", function (e) {
    var item = e.target.closest ? e.target.closest(".asr-item, [data-asr-url]") : null;
    if (!item) { return; }
    if (item.hasAttribute("data-asr-url")) {
      handle(item.getAttribute("data-asr-url"), item.textContent.trim());
    } else {
      var c = byCC[item.getAttribute("data-cc")];
      if (c) { handle(urlFor(c), c.zh); }
    }
  });

  $("asr-force").addEventListener("click", function () {
    closeModal();
    if (pending) { jump(pending); }
  });

  Array.prototype.forEach.call(document.querySelectorAll("[data-asr-close]"), function (el) {
    el.addEventListener("click", closeModal);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !modal.hidden) { closeModal(); }
  });

  /* ---------- 复制链接 ---------- */
  function copyText(text, done) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, function () { fallback(text, done); });
    } else {
      fallback(text, done);
    }
  }

  function fallback(text, done) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:absolute;left:-9999px;top:0";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    try { document.execCommand("copy"); done(); } catch (err) { /* 用户手动复制 */ }
    document.body.removeChild(ta);
  }

  Array.prototype.forEach.call(document.querySelectorAll("[data-asr-copy]"), function (btn) {
    btn.addEventListener("click", function () {
      copyText(location.href, function () {
        var old = btn.textContent;
        btn.textContent = "已复制 ✓";
        var tip = $("asr-copied");
        if (tip) { tip.hidden = true; }
        setTimeout(function () { btn.textContent = old; }, 1800);
      });
    });
  });
})();
</script>
