{{ partial "tools/style.html" . }}
<div class="tk" id="pw">
  <div class="tk-card">
    <div class="tk-field">
      <label class="tk-label" for="pw-len">密码长度：<span id="pw-len-val">16</span> 位</label>
      <input class="tk-range" type="range" id="pw-len" min="6" max="64" step="1" value="16">
    </div>

    <div class="tk-field">
      <span class="tk-label">包含字符</span>
      <div class="tk-row tk-row-tight">
        <label class="tk-check"><input type="checkbox" id="pw-lower" checked><span>小写 a-z</span></label>
        <label class="tk-check"><input type="checkbox" id="pw-upper" checked><span>大写 A-Z</span></label>
        <label class="tk-check"><input type="checkbox" id="pw-digit" checked><span>数字 0-9</span></label>
        <label class="tk-check"><input type="checkbox" id="pw-symbol" checked><span>符号 !@#$…</span></label>
      </div>
    </div>

    <div class="tk-field">
      <span class="tk-label">选项</span>
      <div class="tk-row tk-row-tight">
        <label class="tk-check"><input type="checkbox" id="pw-noambi" checked><span>排除易混淆字符（0O1lI）</span></label>
        <label class="tk-check"><input type="checkbox" id="pw-every" checked><span>每类至少出现一个</span></label>
      </div>
    </div>

    <div class="tk-field">
      <label class="tk-label" for="pw-count">生成数量</label>
      <div class="tk-row">
        <select class="tk-select tk-input-sm" id="pw-count">
          <option value="1">1 条</option>
          <option value="5" selected>5 条</option>
          <option value="10">10 条</option>
          <option value="20">20 条</option>
        </select>
        <button type="button" class="tk-btn" id="pw-gen">重新生成</button>
        <button type="button" class="tk-btn ghost" id="pw-copyall">复制全部</button>
      </div>
    </div>

    <p class="tk-hint" id="pw-strength"></p>
  </div>

  <div class="tk-card">
    <div class="tk-h">结果（点任意一条即可复制）</div>
    <div id="pw-list"></div>
  </div>
</div>
<div class="tk-toast" id="pw-toast"></div>

<style>
.pw-item {
  display: flex;
  align-items: center;
  gap: .6rem;
  padding: .5rem .7rem;
  margin-bottom: .4rem;
  font-family: var(--code-font-family, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace);
  font-size: 15px;
  color: var(--fgColor-default, #333);
  background: var(--bgColor-secondary, #f6f6f6);
  border: 1px solid var(--borderColor-default, #eee);
  border-radius: 8px;
  cursor: pointer;
  overflow-wrap: anywhere;
  -webkit-tap-highlight-color: transparent;
}
.pw-item:last-child { margin-bottom: 0; }
.pw-item:hover { border-color: var(--fgColor-link, #2d809a); }
.pw-item:active { transform: scale(.995); }
.pw-item span { flex: 1 1 auto; min-width: 0; }
.pw-item i { flex: none; font-size: .74rem; font-style: normal; opacity: .55; }
@media only screen and (max-width: 680px) {
  .pw-item { font-size: 14px; padding: .55rem .6rem; }
}
</style>

<script>
(function () {
  "use strict";

  var SETS = {
    lower: "abcdefghijklmnopqrstuvwxyz",
    upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
    digit: "0123456789",
    symbol: "!@#$%^&*()-_=+[]{};:,.?"
  };
  var AMBIGUOUS = "0O1lI";

  var $ = function (id) { return document.getElementById(id); };
  var list = $("pw-list");
  var toast = $("pw-toast");
  var toastTimer;

  function say(msg) {
    toast.textContent = msg;
    toast.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove("on"); }, 1600);
  }

  /* 无偏的密码学随机整数 */
  function randInt(max) {
    var limit = Math.floor(4294967296 / max) * max;
    var buf = new Uint32Array(1);
    var v;
    do {
      crypto.getRandomValues(buf);
      v = buf[0];
    } while (v >= limit);
    return v % max;
  }

  function pick(str) { return str.charAt(randInt(str.length)); }

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = randInt(i + 1);
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function activeSets() {
    var noAmbi = $("pw-noambi").checked;
    var out = [];
    ["lower", "upper", "digit", "symbol"].forEach(function (k) {
      if (!$("pw-" + k).checked) { return; }
      var s = SETS[k];
      if (noAmbi) {
        s = s.split("").filter(function (c) { return AMBIGUOUS.indexOf(c) < 0; }).join("");
      }
      if (s) { out.push(s); }
    });
    return out;
  }

  function makeOne(len, sets, every) {
    var pool = sets.join("");
    var chars = [];
    if (every && sets.length <= len) {
      sets.forEach(function (s) { chars.push(pick(s)); });
    }
    while (chars.length < len) { chars.push(pick(pool)); }
    return shuffle(chars).join("");
  }

  function rate(bits) {
    if (bits < 40) { return ["很弱", "bad"]; }
    if (bits < 60) { return ["一般", "warn"]; }
    if (bits < 80) { return ["较强", "ok"]; }
    return ["很强", "ok"];
  }

  function copy(text, okMsg) {
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.cssText = "position:absolute;left:-9999px;top:0";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      try { document.execCommand("copy"); say(okMsg); } catch (e) { say("复制失败，请手动选中复制"); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { say(okMsg); }, fallback);
    } else {
      fallback();
    }
  }

  function render() {
    var len = parseInt($("pw-len").value, 10);
    var sets = activeSets();
    $("pw-len-val").textContent = len;

    if (!sets.length) {
      list.innerHTML = '<div class="tk-out empty">请至少勾选一类字符</div>';
      $("pw-strength").textContent = "";
      return;
    }

    var every = $("pw-every").checked;
    var poolSize = sets.join("").length;
    var bits = Math.round(len * Math.log(poolSize) / Math.LN2);
    var r = rate(bits);
    $("pw-strength").innerHTML = "字符池 " + poolSize + " 个，约 " + bits +
      ' bit 熵 <span class="tk-badge ' + r[1] + '">' + r[0] + "</span>";

    var n = parseInt($("pw-count").value, 10);
    var frag = document.createDocumentFragment();
    for (var i = 0; i < n; i++) {
      var pwd = makeOne(len, sets, every);
      var row = document.createElement("div");
      row.className = "pw-item";
      row.setAttribute("data-pw", pwd);
      var s = document.createElement("span");
      s.textContent = pwd;
      var ic = document.createElement("i");
      ic.textContent = "复制";
      row.appendChild(s);
      row.appendChild(ic);
      frag.appendChild(row);
    }
    list.innerHTML = "";
    list.appendChild(frag);
  }

  list.addEventListener("click", function (e) {
    var row = e.target.closest ? e.target.closest(".pw-item") : null;
    if (row) { copy(row.getAttribute("data-pw"), "已复制密码"); }
  });

  $("pw-copyall").addEventListener("click", function () {
    var all = Array.prototype.map.call(list.querySelectorAll(".pw-item"), function (el) {
      return el.getAttribute("data-pw");
    });
    if (all.length) { copy(all.join("\n"), "已复制 " + all.length + " 条密码"); }
  });

  $("pw-gen").addEventListener("click", render);
  $("pw-len").addEventListener("input", render);
  ["pw-lower", "pw-upper", "pw-digit", "pw-symbol", "pw-noambi", "pw-every", "pw-count"].forEach(function (id) {
    $(id).addEventListener("change", render);
  });

  render();
})();
</script>
