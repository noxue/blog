{{ partial "tools/style.html" . }}
<div class="tk" id="ec">
  <div class="tk-card">
    <div class="tk-field">
      <span class="tk-label">选择功能</span>
      <div class="tk-seg" id="ec-modes">
        <button type="button" data-mode="b64" class="on">Base64</button>
        <button type="button" data-mode="b64url">Base64 URL</button>
        <button type="button" data-mode="url">URL 编码</button>
        <button type="button" data-mode="html">HTML 实体</button>
        <button type="button" data-mode="unicode">Unicode 转义</button>
        <button type="button" data-mode="hash">哈希</button>
      </div>
    </div>

    <div class="tk-field" id="ec-dir-wrap">
      <span class="tk-label">方向</span>
      <div class="tk-seg" id="ec-dirs">
        <button type="button" data-dir="enc" class="on">编码</button>
        <button type="button" data-dir="dec">解码</button>
      </div>
    </div>

    <div class="tk-field" id="ec-algo-wrap" hidden>
      <span class="tk-label">算法</span>
      <div class="tk-seg" id="ec-algos">
        <button type="button" data-algo="MD5" class="on">MD5</button>
        <button type="button" data-algo="SHA-1">SHA-1</button>
        <button type="button" data-algo="SHA-256">SHA-256</button>
        <button type="button" data-algo="SHA-384">SHA-384</button>
        <button type="button" data-algo="SHA-512">SHA-512</button>
      </div>
    </div>
  </div>

  <div class="tk-card">
    <div class="tk-h">输入</div>
    <textarea class="tk-textarea" id="ec-in" placeholder="在这里粘贴或输入内容…" spellcheck="false"></textarea>
    <div class="tk-row" style="margin-top:.6rem">
      <button type="button" class="tk-btn ghost sm" id="ec-swap">把结果放回输入</button>
      <button type="button" class="tk-btn ghost sm" id="ec-clear">清空</button>
      <span class="tk-spacer"></span>
      <span class="tk-hint" id="ec-stat"></span>
    </div>
  </div>

  <div class="tk-card">
    <div class="tk-h">结果</div>
    <div class="tk-out" id="ec-out">-</div>
    <div class="tk-row" style="margin-top:.6rem">
      <button type="button" class="tk-btn sm" id="ec-copy">复制结果</button>
    </div>
  </div>
</div>
<div class="tk-toast" id="ec-toast"></div>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var mode = "b64";
  var dir = "enc";
  var algo = "MD5";
  var toast = $("ec-toast");
  var toastTimer;

  function say(msg) {
    toast.textContent = msg;
    toast.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove("on"); }, 1600);
  }

  /* ---------- MD5（Web Crypto 不提供，自己实现） ---------- */
  var SH = [7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,
            5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,
            4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,
            6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21];
  var KC = new Uint32Array(64);
  for (var ki = 0; ki < 64; ki++) { KC[ki] = Math.floor(Math.abs(Math.sin(ki + 1)) * 4294967296); }

  function md5(input) {
    var len = input.length;
    var buf = new Uint8Array((((len + 8) >> 6) + 1) * 64);
    buf.set(input);
    buf[len] = 0x80;
    var bits = len * 8;
    var off = buf.length - 8;
    var lo = bits >>> 0, hi = Math.floor(bits / 4294967296);
    buf[off] = lo & 255; buf[off + 1] = (lo >>> 8) & 255; buf[off + 2] = (lo >>> 16) & 255; buf[off + 3] = (lo >>> 24) & 255;
    buf[off + 4] = hi & 255; buf[off + 5] = (hi >>> 8) & 255; buf[off + 6] = (hi >>> 16) & 255; buf[off + 7] = (hi >>> 24) & 255;

    var a0 = 0x67452301, b0 = 0xefcdab89 | 0, c0 = 0x98badcfe | 0, d0 = 0x10325476;
    var M = new Uint32Array(16);
    for (var i = 0; i < buf.length; i += 64) {
      for (var j = 0; j < 16; j++) {
        var p = i + j * 4;
        M[j] = buf[p] | (buf[p + 1] << 8) | (buf[p + 2] << 16) | (buf[p + 3] << 24);
      }
      var A = a0, B = b0, C = c0, D = d0;
      for (var k = 0; k < 64; k++) {
        var F, g;
        if (k < 16) { F = (B & C) | (~B & D); g = k; }
        else if (k < 32) { F = (D & B) | (~D & C); g = (5 * k + 1) & 15; }
        else if (k < 48) { F = B ^ C ^ D; g = (3 * k + 5) & 15; }
        else { F = C ^ (B | ~D); g = (7 * k) & 15; }
        F = (F + A + KC[k] + M[g]) | 0;
        A = D; D = C; C = B;
        var sh = SH[k];
        B = (B + ((F << sh) | (F >>> (32 - sh)))) | 0;
      }
      a0 = (a0 + A) | 0; b0 = (b0 + B) | 0; c0 = (c0 + C) | 0; d0 = (d0 + D) | 0;
    }
    var out = "";
    [a0, b0, c0, d0].forEach(function (w) {
      for (var n = 0; n < 4; n++) {
        var b = (w >>> (n * 8)) & 255;
        out += (b < 16 ? "0" : "") + b.toString(16);
      }
    });
    return out;
  }

  /* ---------- 基础工具 ---------- */
  function toBytes(str) { return new TextEncoder().encode(str); }
  function fromBytes(bytes) { return new TextDecoder("utf-8", { fatal: true }).decode(bytes); }
  function hex(buf) {
    return Array.prototype.map.call(new Uint8Array(buf), function (b) {
      return (b < 16 ? "0" : "") + b.toString(16);
    }).join("");
  }

  function b64encode(str) {
    var bytes = toBytes(str);
    var bin = "";
    for (var i = 0; i < bytes.length; i++) { bin += String.fromCharCode(bytes[i]); }
    return btoa(bin);
  }

  function b64decode(str) {
    var s = str.replace(/[\s\r\n]/g, "");
    var bin = atob(s);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) { bytes[i] = bin.charCodeAt(i); }
    return fromBytes(bytes);
  }

  var HTML_MAP = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
  function htmlEncode(s) {
    return s.replace(/[&<>"']/g, function (c) { return HTML_MAP[c]; });
  }
  function htmlDecode(s) {
    var d = document.createElement("textarea");
    d.innerHTML = s;
    return d.value;
  }

  function uniEncode(s) {
    var out = "";
    for (var i = 0; i < s.length; i++) {
      var c = s.charCodeAt(i);
      if (c < 128) { out += s.charAt(i); }
      else { out += "\\u" + ("000" + c.toString(16)).slice(-4); }
    }
    return out;
  }
  function uniDecode(s) {
    return s.replace(/\\u([0-9a-fA-F]{4})/g, function (_, h) {
      return String.fromCharCode(parseInt(h, 16));
    }).replace(/\\x([0-9a-fA-F]{2})/g, function (_, h) {
      return String.fromCharCode(parseInt(h, 16));
    });
  }

  /* ---------- 主流程 ---------- */
  function run() {
    var input = $("ec-in").value;
    var out = $("ec-out");
    $("ec-stat").textContent = input
      ? (input.length + " 字符 / " + toBytes(input).length + " 字节")
      : "";

    if (!input) {
      out.textContent = "-";
      out.classList.add("empty");
      return;
    }
    out.classList.remove("empty");

    try {
      if (mode === "hash") {
        if (algo === "MD5") {
          out.textContent = md5(toBytes(input));
        } else {
          out.textContent = "计算中…";
          crypto.subtle.digest(algo, toBytes(input)).then(function (buf) {
            out.textContent = hex(buf);
          }, function () {
            out.textContent = "当前浏览器不支持 " + algo + "（需要 HTTPS 环境）";
          });
        }
        return;
      }

      var enc = dir === "enc";
      if (mode === "b64") {
        out.textContent = enc ? b64encode(input) : b64decode(input);
      } else if (mode === "b64url") {
        if (enc) {
          out.textContent = b64encode(input).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
        } else {
          var s = input.replace(/-/g, "+").replace(/_/g, "/");
          while (s.length % 4) { s += "="; }
          out.textContent = b64decode(s);
        }
      } else if (mode === "url") {
        out.textContent = enc ? encodeURIComponent(input) : decodeURIComponent(input);
      } else if (mode === "html") {
        out.textContent = enc ? htmlEncode(input) : htmlDecode(input);
      } else if (mode === "unicode") {
        out.textContent = enc ? uniEncode(input) : uniDecode(input);
      }
    } catch (e) {
      out.textContent = "处理失败：输入内容不是合法的" +
        (mode.indexOf("b64") === 0 ? " Base64" : mode === "url" ? " URL 编码" : "格式") + "。";
    }
  }

  /* ---------- 交互 ---------- */
  function segPick(box, attr, cb) {
    $(box).addEventListener("click", function (e) {
      var b = e.target.closest ? e.target.closest("button") : null;
      if (!b || !b.hasAttribute(attr)) { return; }
      Array.prototype.forEach.call(this.querySelectorAll("button"), function (x) { x.classList.remove("on"); });
      b.classList.add("on");
      cb(b.getAttribute(attr));
    });
  }

  segPick("ec-modes", "data-mode", function (v) {
    mode = v;
    var isHash = v === "hash";
    $("ec-dir-wrap").hidden = isHash;
    $("ec-algo-wrap").hidden = !isHash;
    run();
  });
  segPick("ec-dirs", "data-dir", function (v) { dir = v; run(); });
  segPick("ec-algos", "data-algo", function (v) { algo = v; run(); });

  $("ec-in").addEventListener("input", run);
  $("ec-clear").addEventListener("click", function () { $("ec-in").value = ""; run(); });
  $("ec-swap").addEventListener("click", function () {
    var t = $("ec-out").textContent;
    if (t && t !== "-") { $("ec-in").value = t; run(); }
  });
  $("ec-copy").addEventListener("click", function () {
    var t = $("ec-out").textContent;
    if (!t || t === "-") { return; }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = t;
      ta.style.cssText = "position:absolute;left:-9999px;top:0";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, t.length);
      try { document.execCommand("copy"); say("已复制"); } catch (e) { say("复制失败"); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(t).then(function () { say("已复制"); }, fallback);
    } else { fallback(); }
  });

  run();
})();
</script>
