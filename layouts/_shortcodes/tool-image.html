{{ partial "tools/style.html" . }}
<div class="tk" id="im">
  <div class="tk-tip">
    图片<strong>只在你自己的浏览器里处理</strong>，不会上传到任何服务器，关掉页面就没了。
  </div>

  <div class="tk-card">
    <div class="im-drop" id="im-drop">
      <input type="file" id="im-file" accept="image/*" multiple hidden>
      <span class="im-drop-icon" aria-hidden="true">🖼️</span>
      <strong>点击选择图片</strong>
      <span class="tk-hint">也可以直接把图片拖进来 · 支持多选 · JPG / PNG / WebP / HEIC（取决于浏览器）</span>
    </div>

    <div class="tk-grid2" style="margin-top:1rem">
      <div class="tk-field">
        <label class="tk-label" for="im-maxw">最大宽度：<span id="im-maxw-val">1600</span> px（不会放大小图）</label>
        <input class="tk-range" type="range" id="im-maxw" min="200" max="4096" step="8" value="1600">
      </div>
      <div class="tk-field">
        <label class="tk-label" for="im-quality">质量：<span id="im-quality-val">80</span></label>
        <input class="tk-range" type="range" id="im-quality" min="30" max="100" step="1" value="80">
      </div>
    </div>

    <div class="tk-field">
      <span class="tk-label">输出格式</span>
      <div class="tk-seg" id="im-formats">
        <button type="button" data-fmt="image/webp" class="on">WebP</button>
        <button type="button" data-fmt="image/jpeg">JPEG</button>
        <button type="button" data-fmt="image/png">PNG</button>
      </div>
      <p class="tk-hint" id="im-fmt-hint">WebP 体积最小，现代浏览器和微信都支持。PNG 是无损的，质量选项对它无效。</p>
    </div>

    <div class="tk-row">
      <button type="button" class="tk-btn" id="im-run" disabled>重新压缩</button>
      <button type="button" class="tk-btn ghost" id="im-dlall" disabled>下载全部</button>
      <button type="button" class="tk-btn ghost" id="im-reset" disabled>清空</button>
    </div>
    <p class="tk-hint" id="im-summary"></p>
  </div>

  <div id="im-list"></div>
</div>
<div class="tk-toast" id="im-toast"></div>

<style>
.im-drop {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: .3rem;
  padding: 1.6rem 1rem;
  text-align: center;
  border: 2px dashed var(--borderColor-default, #ddd);
  border-radius: 12px;
  color: var(--fgColor-default, #333);
  cursor: pointer;
  transition: border-color .15s, background .15s;
}
.im-drop:hover, .im-drop.over {
  border-color: var(--fgColor-link, #2d809a);
  background: var(--bgColor-secondary, #fafafa);
}
.im-drop-icon { font-size: 1.6rem; }
.im-drop .tk-hint { margin: 0; }

.im-item {
  display: flex;
  gap: .8rem;
  align-items: center;
  padding: .7rem;
  margin-bottom: .6rem;
  border: 1px solid var(--borderColor-default, #e4e4e4);
  border-radius: 10px;
  background: var(--bgColor-default, #fff);
}
.im-thumb {
  flex: none;
  width: 4.2rem;
  height: 4.2rem;
  object-fit: cover;
  border-radius: 8px;
  background: var(--bgColor-secondary, #f0f0f0);
}
.im-body { flex: 1 1 auto; min-width: 0; }
.im-name {
  font-size: .86rem;
  font-weight: 600;
  color: var(--fgColor-default, #333);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.im-meta { margin-top: .2rem; font-size: .78rem; line-height: 1.6; color: var(--fgColor-secondary, #888); }
.im-actions { flex: none; }
@media only screen and (max-width: 680px) {
  .im-item { flex-wrap: wrap; }
  .im-thumb { width: 3.4rem; height: 3.4rem; }
  .im-body { flex: 1 1 8rem; }
  .im-actions { flex: 1 1 100%; }
  .im-actions .tk-btn { width: 100%; }
}
</style>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var files = [];
  var results = [];
  var fmt = "image/webp";
  var toast = $("im-toast");
  var toastTimer;
  var MAX_PIXELS = 40e6; /* 超大图在手机上会直接把 canvas 画崩 */

  function say(msg) {
    toast.textContent = msg;
    toast.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove("on"); }, 2000);
  }

  function human(n) {
    if (n < 1024) { return n + " B"; }
    if (n < 1048576) { return (n / 1024).toFixed(1) + " KB"; }
    return (n / 1048576).toFixed(2) + " MB";
  }

  function baseName(name) { return name.replace(/\.[^.]+$/, ""); }
  function extOf(type) { return type === "image/webp" ? "webp" : type === "image/png" ? "png" : "jpg"; }
  function label(type) { return type === "image/webp" ? "WebP" : type === "image/png" ? "PNG" : "JPEG"; }

  /* 老浏览器不支持某些格式时 toBlob 会静默退回 PNG，先探一下 */
  function supportsType(type) {
    try {
      var c = document.createElement("canvas");
      c.width = c.height = 1;
      return c.toDataURL(type).indexOf("data:" + type) === 0;
    } catch (e) { return false; }
  }

  function loadImage(file) {
    return new Promise(function (resolve, reject) {
      if (window.createImageBitmap) {
        createImageBitmap(file).then(resolve, function () { viaImg(file, resolve, reject); });
      } else {
        viaImg(file, resolve, reject);
      }
    });
  }

  function viaImg(file, resolve, reject) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () { resolve(img); URL.revokeObjectURL(url); };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("无法解码这个图片")); };
    img.src = url;
  }

  function encode(canvas, type, quality) {
    return new Promise(function (resolve, reject) {
      if (canvas.toBlob) {
        canvas.toBlob(function (blob) {
          if (blob) { resolve(blob); } else { reject(new Error("浏览器不支持导出为该格式")); }
        }, type, quality);
      } else {
        reject(new Error("浏览器太旧，不支持 canvas.toBlob"));
      }
    });
  }

  function processOne(file, maxW, quality) {
    return loadImage(file).then(function (src) {
      var w = src.width, h = src.height;
      if (w * h > MAX_PIXELS) { throw new Error("图片像素太多（" + w + "×" + h + "），换台电脑或先裁小一点"); }
      var scale = Math.min(1, maxW / w);
      var dw = Math.max(1, Math.round(w * scale));
      var dh = Math.max(1, Math.round(h * scale));

      var cv = document.createElement("canvas");
      cv.width = dw;
      cv.height = dh;
      var ctx = cv.getContext("2d");
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";
      if (fmt === "image/jpeg") {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, dw, dh);
      }
      ctx.drawImage(src, 0, 0, dw, dh);
      if (src.close) { src.close(); }

      var want = fmt;
      return encode(cv, want, quality / 100).then(function (blob) {
        /* 浏览器不支持目标格式时会静默回退成 PNG */
        var got = blob.type || want;
        return {
          name: baseName(file.name) + "." + extOf(got),
          srcSize: file.size, srcW: w, srcH: h,
          outSize: blob.size, outW: dw, outH: dh,
          type: got,
          fellBack: got !== want ? label(want) + " → " + label(got) : "",
          url: URL.createObjectURL(blob)
        };
      });
    });
  }

  function render() {
    var box = $("im-list");
    box.innerHTML = "";
    var totalIn = 0, totalOut = 0;

    results.forEach(function (r, i) {
      var item = document.createElement("div");
      item.className = "im-item";

      if (r.error) {
        item.innerHTML = '<div class="im-body"><div class="im-name"></div>' +
          '<div class="im-meta" style="color:#c45656"></div></div>';
        item.querySelector(".im-name").textContent = r.name;
        item.querySelector(".im-meta").textContent = r.error;
        box.appendChild(item);
        return;
      }

      totalIn += r.srcSize;
      totalOut += r.outSize;
      var save = r.srcSize ? Math.round((1 - r.outSize / r.srcSize) * 100) : 0;

      var img = document.createElement("img");
      img.className = "im-thumb";
      img.src = r.url;
      img.alt = r.name;
      img.loading = "lazy";

      var body = document.createElement("div");
      body.className = "im-body";
      var nm = document.createElement("div");
      nm.className = "im-name";
      nm.textContent = r.name;
      var meta = document.createElement("div");
      meta.className = "im-meta";
      meta.innerHTML = r.srcW + "×" + r.srcH + " → " + r.outW + "×" + r.outH + "<br>" +
        human(r.srcSize) + " → <strong>" + human(r.outSize) + "</strong> " +
        '<span class="tk-badge ' + (save > 0 ? "ok" : "warn") + '">' +
        (save > 0 ? "省 " + save + "%" : "变大 " + Math.abs(save) + "%") + "</span>" +
        (r.fellBack ? '<br><span class="tk-badge warn">浏览器不支持，已改用 ' + r.fellBack.split(" → ")[1] + "</span>" : "");
      body.appendChild(nm);
      body.appendChild(meta);

      var act = document.createElement("div");
      act.className = "im-actions";
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "tk-btn sm";
      btn.textContent = "下载";
      btn.addEventListener("click", function () { download(r.url, r.name); });
      act.appendChild(btn);

      item.appendChild(img);
      item.appendChild(body);
      item.appendChild(act);
      box.appendChild(item);
    });

    var okCount = results.filter(function (r) { return !r.error; }).length;
    var pct = totalIn ? Math.round((1 - totalOut / totalIn) * 100) : 0;
    $("im-summary").innerHTML = okCount
      ? ("共 " + okCount + " 张，" + human(totalIn) + " → <strong>" + human(totalOut) + "</strong>，" +
         (pct >= 0 ? "总共省了 " + pct + "%" : "总体积反而增加了 " + Math.abs(pct) + "%，换个格式或降低质量试试"))
      : "";
    $("im-dlall").disabled = !okCount;
  }

  function download(href, name) {
    var a = document.createElement("a");
    a.href = href;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  function runAll() {
    if (!files.length) { return; }
    var maxW = parseInt($("im-maxw").value, 10);
    var q = parseInt($("im-quality").value, 10);
    $("im-run").disabled = true;
    $("im-summary").textContent = "处理中…";

    results.forEach(function (r) { if (r.url) { URL.revokeObjectURL(r.url); } });
    results = [];

    var chain = Promise.resolve();
    files.forEach(function (f) {
      chain = chain.then(function () {
        return processOne(f, maxW, q).then(function (r) {
          results.push(r);
        }, function (err) {
          results.push({ name: f.name, error: err && err.message ? err.message : "处理失败" });
        });
      });
    });
    chain.then(function () {
      $("im-run").disabled = false;
      render();
    });
  }

  function addFiles(fileList) {
    var picked = Array.prototype.filter.call(fileList, function (f) {
      return /^image\//.test(f.type) || /\.(jpe?g|png|webp|gif|bmp|heic|heif|avif)$/i.test(f.name);
    });
    if (!picked.length) { return say("没有识别到图片文件"); }
    files = files.concat(picked);
    $("im-run").disabled = false;
    $("im-reset").disabled = false;
    runAll();
  }

  /* ---------- 交互 ---------- */
  var drop = $("im-drop");
  drop.addEventListener("click", function () { $("im-file").click(); });
  $("im-file").addEventListener("change", function () {
    addFiles(this.files);
    this.value = "";
  });
  ["dragenter", "dragover"].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add("over"); });
  });
  ["dragleave", "drop"].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove("over"); });
  });
  drop.addEventListener("drop", function (e) {
    if (e.dataTransfer && e.dataTransfer.files) { addFiles(e.dataTransfer.files); }
  });

  $("im-run").addEventListener("click", runAll);
  $("im-dlall").addEventListener("click", function () {
    var ok = results.filter(function (r) { return !r.error; });
    ok.forEach(function (r, i) {
      setTimeout(function () { download(r.url, r.name); }, i * 350);
    });
    say("开始逐个下载 " + ok.length + " 张，浏览器可能会问你是否允许");
  });
  $("im-reset").addEventListener("click", function () {
    results.forEach(function (r) { if (r.url) { URL.revokeObjectURL(r.url); } });
    files = [];
    results = [];
    $("im-list").innerHTML = "";
    $("im-summary").textContent = "";
    $("im-run").disabled = true;
    $("im-dlall").disabled = true;
    $("im-reset").disabled = true;
  });

  $("im-maxw").addEventListener("input", function () { $("im-maxw-val").textContent = this.value; });
  $("im-quality").addEventListener("input", function () { $("im-quality-val").textContent = this.value; });
  $("im-maxw").addEventListener("change", runAll);
  $("im-quality").addEventListener("change", runAll);

  $("im-formats").addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("button[data-fmt]") : null;
    if (!b || b.disabled) { return; }
    Array.prototype.forEach.call(this.querySelectorAll("button"), function (x) { x.classList.remove("on"); });
    b.classList.add("on");
    fmt = b.getAttribute("data-fmt");
    $("im-quality").disabled = fmt === "image/png";
    runAll();
  });

  /* 探测浏览器支持的输出格式，不支持的直接禁掉并换默认值 */
  (function initFormats() {
    var unsupported = [];
    Array.prototype.forEach.call($("im-formats").querySelectorAll("button[data-fmt]"), function (b) {
      var t = b.getAttribute("data-fmt");
      if (t !== "image/png" && !supportsType(t)) {
        unsupported.push(label(t));
        b.disabled = true;
        b.style.opacity = ".45";
        b.style.cursor = "not-allowed";
        b.title = "当前浏览器不支持导出 " + label(t);
        if (b.classList.contains("on")) {
          b.classList.remove("on");
          var alt = $("im-formats").querySelector('button[data-fmt="image/jpeg"]:not([disabled])') ||
            $("im-formats").querySelector('button[data-fmt="image/png"]');
          if (alt) { alt.classList.add("on"); fmt = alt.getAttribute("data-fmt"); }
        }
      }
    });
    if (unsupported.length) {
      $("im-fmt-hint").innerHTML = '<span class="tk-badge warn">当前浏览器不支持导出 ' +
        unsupported.join(" / ") + "</span> 已自动切换到可用格式。想用 WebP 请升级浏览器（Safari 16.4+ / 新版 Chrome）。";
    }
  })();
})();
</script>
